<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}naf{% endblock %}</title>
  <meta name="description" content="Informes de noticias con fuentes y audio en español.">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="site-header">
    <a class="brand" href="/">naf</a>
    <nav aria-label="Navegación principal">
      <ul>
        <li><a href="/"{% if request.url.path == "/" %} aria-current="page"{% endif %}>Informes</a></li>
        <li><a href="/sources"{% if request.url.path == "/sources" %} aria-current="page"{% endif %}>Fuentes</a></li>
        <li><a href="/classifications"{% if request.url.path == "/classifications" %} aria-current="page"{% endif %}>Clasificación</a></li>
      </ul>
    </nav>
  </header>
  <main id="contenido" class="page" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>NAF · Informes con fuentes y audio en español.</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
