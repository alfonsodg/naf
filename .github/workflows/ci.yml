name: CI

on:
  push:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, security and unit tests
    runs-on: ubuntu-latest
    env:
      # Deterministic, non-secret values so settings load in CI.
      NAF_DATABASE_URL: postgresql://ci:ci@localhost:5432/naf_ci
      NAF_MINIFLUX_URL: http://localhost:8080
      NAF_MINIFLUX_API_KEY: ci-placeholder-token
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format check
        run: uv run ruff format --check src tests scripts

      - name: Type check
        run: uv run mypy src/

      - name: Security scan
        run: uv run bandit -r src/ -q

      # Fails on advisories reachable from the deployed dependency set. The
      # optional "audio" extra is excluded: it is never installed in the
      # runtime image. The pytest advisory below cannot be fixed while
      # podcastfy pins pytest<9.0.0; tracked in issue #11.
      - name: Dependency audit
        run: |
          uv audit --no-extra audio \
            --ignore GHSA-6w46-j5rx-g56g \

      - name: Unit and contract tests
        run: uv run pytest tests/unit --cov=src --cov-report=term-missing --cov-fail-under=80

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            *.md
            docs/**/*.md
