# Edge proxy for the naf API (issue #47).
#
# This file is mounted at /etc/nginx/conf.d/default.conf, a path the stock
# nginx.conf includes inside its http block. The limit_req_zone below is an
# http-context directive, so it is legal at the top of this file and only here;
# it is not part of the server block that follows. Keep it first.

limit_req_zone $binary_remote_addr zone=reports:10m rate=1r/s;

server {
    listen 8080;
    server_name _;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    # Docker's embedded DNS. Resolving the upstream through a variable makes
    # nginx look it up per request instead of pinning the IP it saw when it
    # started, so recreating the naf container does not leave the proxy
    # answering 502 until it is restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $naf_upstream http://naf:8000;

    # A report or a spoken edition keeps the upstream busy for minutes; the
    # default 60 s would cut the connection before the response exists.
    proxy_read_timeout 300s;

    # The intake cap is 1 MB by default; 8 MB leaves room for an OPML export
    # sent as a form body without turning the proxy into an upload surface.
    client_max_body_size 8m;

    # The API has no authentication of its own: this proxy is the access
    # control. Every location inherits it unless it opts out explicitly.
    auth_basic "naf";
    auth_basic_user_file /etc/nginx/htpasswd;

    # Container liveness probe and external health check. It reaches only the
    # upstream liveness route, which answers {"status":"ok"} and touches no
    # dependency; every other path requires credentials.
    location = /health {
        auth_basic off;
        proxy_pass $naf_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Report creation is the expensive route: it calls the model provider and
    # can synthesize audio. One request per second per client, a burst of 10,
    # and anything beyond the burst is rejected at once (nodelay) instead of
    # queueing a request that would only time out.
    location /api/v1/reports {
        limit_req zone=reports burst=10 nodelay;
        proxy_pass $naf_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API, web interface, and static assets share the same authenticated path.
    location / {
        proxy_pass $naf_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
