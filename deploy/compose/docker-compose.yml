# Development orchestration for naf (Docker Compose).
# Service names are immutable: other services resolve them by DNS name.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${NAF_DB_USER:?NAF_DB_USER is required}
      POSTGRES_PASSWORD: ${NAF_DB_PASSWORD:?NAF_DB_PASSWORD is required}
      POSTGRES_DB: ${NAF_DB_NAME:?NAF_DB_NAME is required}
    volumes:
      - naf-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NAF_DB_USER} -d ${NAF_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  miniflux-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${NAF_MINIFLUX_DB_USER:?NAF_MINIFLUX_DB_USER is required}
      POSTGRES_PASSWORD: ${NAF_MINIFLUX_DB_PASSWORD:?NAF_MINIFLUX_DB_PASSWORD is required}
      POSTGRES_DB: ${NAF_MINIFLUX_DB_NAME:?NAF_MINIFLUX_DB_NAME is required}
    volumes:
      - miniflux-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NAF_MINIFLUX_DB_USER} -d ${NAF_MINIFLUX_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  miniflux:
    image: miniflux/miniflux:2.3.3
    depends_on:
      miniflux-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${NAF_MINIFLUX_DB_USER}:${NAF_MINIFLUX_DB_PASSWORD}@miniflux-db:5432/${NAF_MINIFLUX_DB_NAME}?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${NAF_MINIFLUX_ADMIN_USERNAME:?NAF_MINIFLUX_ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${NAF_MINIFLUX_ADMIN_PASSWORD:?NAF_MINIFLUX_ADMIN_PASSWORD is required}
      BASE_URL: http://localhost:${NAF_MINIFLUX_PORT:-8080}
    volumes:
      - miniflux-data:/var/lib/miniflux
    ports:
      - "${NAF_MINIFLUX_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  naf:
    image: ${NAF_IMAGE:?NAF_IMAGE is required}
    depends_on:
      db:
        condition: service_healthy
      miniflux:
        condition: service_healthy
    environment:
      NAF_DATABASE_URL: postgresql://${NAF_DB_USER}:${NAF_DB_PASSWORD}@db:5432/${NAF_DB_NAME}
      NAF_MINIFLUX_URL: ${NAF_MINIFLUX_URL:-http://miniflux:8080}
      NAF_MINIFLUX_API_KEY: ${NAF_MINIFLUX_API_KEY}
      NAF_AUDIO_STORAGE_PATH: /data/audio
    volumes:
      - naf-audio:/data/audio
    ports:
      - "127.0.0.1:${NAF_PORT:?NAF_PORT is required}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  naf-db:
  naf-audio:
  miniflux-db:
  miniflux-data:
