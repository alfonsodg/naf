# Development orchestration for naf (Docker Compose).
# Service names are immutable: other services resolve them by DNS name.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${NAF_DB_USER:?NAF_DB_USER is required}
      POSTGRES_PASSWORD: ${NAF_DB_PASSWORD:?NAF_DB_PASSWORD is required}
      POSTGRES_DB: ${NAF_DB_NAME:?NAF_DB_NAME is required}
    volumes:
      - naf-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NAF_DB_USER} -d ${NAF_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  miniflux-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${NAF_MINIFLUX_DB_USER:?NAF_MINIFLUX_DB_USER is required}
      POSTGRES_PASSWORD: ${NAF_MINIFLUX_DB_PASSWORD:?NAF_MINIFLUX_DB_PASSWORD is required}
      POSTGRES_DB: ${NAF_MINIFLUX_DB_NAME:?NAF_MINIFLUX_DB_NAME is required}
    volumes:
      - miniflux-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NAF_MINIFLUX_DB_USER} -d ${NAF_MINIFLUX_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  miniflux:
    image: miniflux/miniflux:2.3.3
    depends_on:
      miniflux-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${NAF_MINIFLUX_DB_USER}:${NAF_MINIFLUX_DB_PASSWORD}@miniflux-db:5432/${NAF_MINIFLUX_DB_NAME}?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${NAF_MINIFLUX_ADMIN_USERNAME:?NAF_MINIFLUX_ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${NAF_MINIFLUX_ADMIN_PASSWORD:?NAF_MINIFLUX_ADMIN_PASSWORD is required}
      # Browser-facing address of the reader. It must match how a person
      # reaches it; the internal service URL stays http://miniflux:8080.
      BASE_URL: ${NAF_MINIFLUX_BASE_URL:-http://localhost:8080}
      # Decision 4: RSS/Atom every 15-30 minutes. 20 keeps the 8-30 source pack
      # inside the promised window; the reader still honours Cache-Control,
      # ETag, and Last-Modified, so polling more often costs no full download.
      POLLING_FREQUENCY: ${NAF_MINIFLUX_POLLING_FREQUENCY:-20}
      # Fan-out scheduler for due feeds; round_robin spreads the pack across
      # cycles without starving low-frequency sources.
      POLLING_SCHEDULER: ${NAF_MINIFLUX_POLLING_SCHEDULER:-round_robin}
      # Feeds refreshed per scheduler pass. 50 covers the 8-30 source pack with
      # headroom, so one pass never truncates the pack.
      BATCH_SIZE: ${NAF_MINIFLUX_BATCH_SIZE:-50}
      # Decision 8 (retention): the cleanup is declared here instead of left at
      # the reader's inherited defaults (60 and 180 days). The approved window
      # is 90 days after an entry is read; unread entries get 180 so nothing
      # expires before it had a chance to be read. Archiving writes a tombstone,
      # so an archived entry is never imported again by a later feed refresh.
      CLEANUP_ARCHIVE_READ_DAYS: ${NAF_MINIFLUX_CLEANUP_READ_DAYS:-90}
      CLEANUP_ARCHIVE_UNREAD_DAYS: ${NAF_MINIFLUX_CLEANUP_UNREAD_DAYS:-180}
      # Hours between cleanup runs; 24 keeps the window exact to a day.
      CLEANUP_FREQUENCY: ${NAF_MINIFLUX_CLEANUP_FREQUENCY:-24}
    volumes:
      - miniflux-data:/var/lib/miniflux
    ports:
      - "${NAF_MINIFLUX_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  naf:
    image: ${NAF_IMAGE:?NAF_IMAGE is required}
    depends_on:
      db:
        condition: service_healthy
      miniflux:
        condition: service_healthy
    environment:
      NAF_DATABASE_URL: postgresql://${NAF_DB_USER}:${NAF_DB_PASSWORD}@db:5432/${NAF_DB_NAME}
      NAF_MINIFLUX_URL: ${NAF_MINIFLUX_URL:-http://miniflux:8080}
      NAF_MINIFLUX_API_KEY: ${NAF_MINIFLUX_API_KEY:?NAF_MINIFLUX_API_KEY is required}
      NAF_AUDIO_STORAGE_PATH: /data/audio
      # The cap stays enforced while the body is read; forwarding it lets a
      # deployment raise it for a large but legitimate feed.
      NAF_FEED_INTAKE_MAX_BYTES: ${NAF_FEED_INTAKE_MAX_BYTES:-1000000}
      # Report generator. Empty model or key leaves the routes answering 503
      # until a provider is provisioned, instead of failing at startup.
      NAF_LLM_PROVIDER: ${NAF_LLM_PROVIDER:-openai}
      NAF_LLM_BASE_URL: ${NAF_LLM_BASE_URL:-https://api.openai.com/v1}
      NAF_LLM_API_KEY: ${NAF_LLM_API_KEY:-}
      NAF_LLM_MODEL: ${NAF_LLM_MODEL:-}
      NAF_LLM_TIMEOUT: ${NAF_LLM_TIMEOUT:-60}
      NAF_LLM_MAX_OUTPUT_TOKENS: ${NAF_LLM_MAX_OUTPUT_TOKENS:-4000}
      NAF_REPORT_MAX_ENTRIES: ${NAF_REPORT_MAX_ENTRIES:-120}
      NAF_REPORT_DEFAULT_DAYS: ${NAF_REPORT_DEFAULT_DAYS:-7}
      # Spanish speech for a stored report. The models are mounted read-only
      # from the host; empty paths disable the audio routes with 503.
      NAF_TTS_MODEL_PATH: ${NAF_TTS_MODEL_PATH:-/models/kokoro-v1.0.onnx}
      NAF_TTS_VOICES_PATH: ${NAF_TTS_VOICES_PATH:-/models/voices-v1.0.bin}
      NAF_TTS_VOICE: ${NAF_TTS_VOICE:-ef_dora}
      NAF_TTS_SPEED: ${NAF_TTS_SPEED:-1.0}
    volumes:
      - naf-audio:/data/audio
      # Kokoro ONNX models live on the host; the image carries only the runtime.
      - ${NAF_MODELS_DIR:-/opt/naf/models}:/models:ro
    ports:
      - "127.0.0.1:${NAF_PORT:?NAF_PORT is required}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Issue #47: the API has no authentication of its own, so this proxy is the
  # only public surface and the API keeps its loopback publication above. The
  # config is tracked; the password file is a deployment artefact and is never
  # committed. Plain HTTP, so the credentials travel unencrypted until TLS or
  # a private network replaces it.
  proxy:
    image: nginx:1.27-alpine
    depends_on: [naf]
    volumes:
      # Relative paths resolve from this file's directory, so ../proxy is
      # deploy/proxy. The config is included by the stock nginx.conf inside
      # its http block.
      - ../proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NAF_PROXY_HTPASSWD:?NAF_PROXY_HTPASSWD is required}:/etc/nginx/htpasswd:ro
    ports:
      - "${NAF_PROXY_PORT:-18082}:8080"
    healthcheck:
      # /health is the only unauthenticated path, answered by the upstream
      # liveness route; every other path answers 401 without credentials.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  naf-db:
  naf-audio:
  miniflux-db:
  miniflux-data:
